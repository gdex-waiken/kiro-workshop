<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="The AI-DLC loop: AI plans, AI asks, you validate, AI implements, repeated for every step">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8E48FF"/>
    </marker>
  </defs>
  <rect width="640" height="420" rx="24" fill="#15112B"/>
  <circle cx="320" cy="210" r="140" fill="none" stroke="#8E48FF" stroke-width="4" stroke-dasharray="0"/>
  <path d="M 405 98 A 140 140 0 0 1 428 122" fill="none" stroke="#8E48FF" stroke-width="4" marker-end="url(#h)"/>
  <path d="M 432 298 A 140 140 0 0 1 408 320" fill="none" stroke="#8E48FF" stroke-width="4" marker-end="url(#h)"/>
  <path d="M 235 322 A 140 140 0 0 1 212 298" fill="none" stroke="#8E48FF" stroke-width="4" marker-end="url(#h)"/>
  <path d="M 208 122 A 140 140 0 0 1 232 98" fill="none" stroke="#8E48FF" stroke-width="4" marker-end="url(#h)"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <circle cx="320" cy="70" r="34" fill="#1E1530" stroke="#8E48FF" stroke-width="3"/>
    <text x="320" y="78" font-size="26" fill="#B99CFF">1</text>
    <text x="320" y="24" font-size="20" font-weight="700" fill="#FFFFFF">AI plans</text>
    <circle cx="460" cy="210" r="34" fill="#1E1530" stroke="#8E48FF" stroke-width="3"/>
    <text x="460" y="218" font-size="26" fill="#B99CFF">2</text>
    <text x="560" y="204" font-size="20" font-weight="700" fill="#FFFFFF">AI asks</text>
    <text x="560" y="228" font-size="14" fill="#D9D4E6">in question files</text>
    <circle cx="320" cy="350" r="34" fill="#8E48FF"/>
    <text x="320" y="358" font-size="26" fill="#FFFFFF">3</text>
    <text x="320" y="410" font-size="20" font-weight="700" fill="#B99CFF">You validate</text>
    <circle cx="180" cy="210" r="34" fill="#1E1530" stroke="#8E48FF" stroke-width="3"/>
    <text x="180" y="218" font-size="26" fill="#B99CFF">4</text>
    <text x="80" y="204" font-size="20" font-weight="700" fill="#FFFFFF">AI builds</text>
    <text x="80" y="228" font-size="14" fill="#D9D4E6">only after approval</text>
    <text x="320" y="204" font-size="24" font-weight="700" fill="#B99CFF">Bolts</text>
    <text x="320" y="230" font-size="15" fill="#D9D4E6">hours or days, not weeks</text>
  </g>
</svg>
